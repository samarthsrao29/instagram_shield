<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Shield Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <h1>Settings</h1>
            </div>
        </header>

        <section class="settings-section">
            <div class="section-header">
                <h2>Profile</h2>
                <p>How you appear on the leaderboard.</p>
            </div>
            <div class="input-group">
                <label for="display-name">Display Name</label>
                <input type="text" id="display-name" placeholder="Anonymous Archer">
            </div>
        </section>

        <section class="settings-section">
            <div class="section-header">
                <h2>AI Features (Optional)</h2>
                <p>Bring your own Groq API key to generate fresh AI content in Read Mode.</p>
            </div>
            <div class="input-group">
                <label for="groq-key">Groq API Key</label>
                <input type="password" id="groq-key" placeholder="gsk_...">
                <p class="help-text">Get your free key at <a href="https://console.groq.com/" target="_blank">console.groq.com</a></p>
            </div>
        </section>

        <div class="footer">
            <div id="status-message" class="status"></div>
            <button id="save-btn" class="btn-primary">Save Changes</button>
        </div>
    </div>
    <script src="options.js"></script>
</body>
</html>
