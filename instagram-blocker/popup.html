<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Shield</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                <h1>Focus System</h1>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </div>
                    <span class="stat-label">Instagram</span>
                </div>
                <div id="insta-time" class="stat-value">0m</div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                    <span class="stat-label">Blocks Enabled</span>
                </div>
                <div id="blocks-count" class="stat-value">0</div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <div class="stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    </div>
                    <span class="stat-label">Time Reading</span>
                </div>
                <div id="read-time" class="stat-value">0m</div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-header">
                <span>Current Allowance</span>
                <span id="allowance-text" style="color: var(--text-primary)">0 / 2 min</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div class="pref-section">
            <div class="pref-row">
                <span>Reading Topic:</span>
                <select id="topic-select" class="topic-select">
                    <option value="Any">Mixed Topics</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Machine Learning">Machine Learning</option>
                    <option value="Deep Learning">Deep Learning</option>
                    <option value="Trending News">Trending News</option>
                </select>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 4px;">
            <button id="open-reading" class="btn-primary" style="flex: 1;">Open Reader</button>
            <button id="open-analytics" class="btn-primary" style="flex: 1; background-color: #86868b;">Analytics</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
